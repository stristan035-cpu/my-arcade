<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d1d">
  <title>Star Catcher — My Arcade</title>
  <style>
    :root { color-scheme: dark; --ink:#f7f8ff; --muted:#aebbd6; --aqua:#66f1df; --pink:#ff73cb; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; }
    body {
      min-height:100vh; display:grid; place-items:center; padding:20px;
      color:var(--ink); font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
      background:radial-gradient(ellipse at 50% 0%,#303d74 0%,#17223e 43%,#090d1d 100%);
    }
    .shell { width:min(100%,900px); }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin:0 4px 14px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:46px; height:46px; display:grid; place-items:center; border-radius:14px; background:linear-gradient(145deg,#43f5de,#7864ff 54%,#ff4fc8); box-shadow:0 0 24px #5de8f877; font-size:25px; }
    h1 { margin:0; font-size:clamp(22px,4vw,30px); line-height:1; letter-spacing:-.04em; text-shadow:0 0 18px #a16cff; }
    .subtitle { margin:5px 0 0; color:#70edee; font-size:10px; font-weight:850; letter-spacing:.17em; text-transform:uppercase; }
    .stats { display:flex; gap:8px; }
    .stat { min-width:100px; padding:8px 12px; border:1px solid #8fa9d044; border-radius:11px; background:#10172dbb; text-align:center; }
    .stat-label { color:#9eafd0; font-size:10px; font-weight:850; letter-spacing:.13em; text-transform:uppercase; }
    .stat-value { margin-top:2px; font-size:20px; font-weight:950; }
    .stat-value .good { color:#ffe36a; }
    .stat-value .bad { color:#ff6688; }
    .frame { position:relative; padding:10px; overflow:hidden; border:2px solid #58e8eb; border-radius:19px; background:linear-gradient(145deg,#182547,#11172e 60%,#201534); box-shadow:0 0 0 5px #12182b,0 0 0 7px #f04fc855,0 24px 70px #02040bbd,0 0 35px #2ff7ef22; }
    .frame::before { position:absolute; z-index:1; inset:0 0 auto; height:4px; background:linear-gradient(90deg,#ff4fc8,#ffc53d,#5df3d5,#7380ff,#ff4fc8); content:""; }
    canvas { display:block; width:100%; height:min(66vh,570px); min-height:340px; border:1px solid #65dae866; border-radius:11px; background:#101328; touch-action:none; }
    .overlay { position:absolute; z-index:2; inset:10px; display:grid; place-items:center; border-radius:11px; background:linear-gradient(135deg,#10152de8,#1a1031df); backdrop-filter:blur(7px); transition:opacity .2s; }
    .overlay.hidden { opacity:0; pointer-events:none; }
    .dialog { max-width:420px; padding:24px; text-align:center; }
    .eyebrow { color:var(--aqua); font-size:11px; font-weight:950; letter-spacing:.22em; text-transform:uppercase; }
    h2 { margin:10px 0; font-size:clamp(32px,7vw,48px); line-height:1.02; letter-spacing:-.055em; text-shadow:0 0 22px #ac4dff; }
    .message { max-width:330px; margin:10px auto 22px; color:#c0cce4; line-height:1.55; }
    button { border:1px solid #fff9; border-radius:11px; padding:14px 26px; color:#111936; background:linear-gradient(110deg,#57f5dc,#78c8ff 48%,#d889ff); font:inherit; font-size:16px; font-weight:950; cursor:pointer; box-shadow:0 0 22px #48e8df66,0 5px 0 #5242a5; transition:transform .15s,filter .15s; }
    button:hover { transform:translateY(-2px); filter:brightness(1.12); }
    button:active { transform:translateY(2px); }
    button:focus-visible { outline:3px solid white; outline-offset:4px; }
    footer { display:flex; justify-content:space-between; gap:12px; padding:14px 8px 0; color:#a0b0cd; font-size:12px; }
    .keys { display:flex; align-items:center; gap:5px; }
    kbd { padding:3px 7px; border:1px solid #6e8baa; border-bottom:3px solid #455879; border-radius:6px; color:#dbfaff; background:#1c2945; font:inherit; font-size:11px; font-weight:900; }
    .touch { display:none; justify-content:center; gap:14px; margin-top:12px; }
    .touch button { width:78px; padding:12px; border-color:#57eee477; color:#70f7e5; background:linear-gradient(145deg,#293b64,#181f3b); box-shadow:0 4px 0 #10152a; font-size:22px; touch-action:none; user-select:none; }
    @media(max-width:560px) {
      body { padding:16px 13px; }
      .frame { padding:7px; border-radius:16px; }
      header { align-items:flex-start; }
      .brand { gap:8px; }
      .brand-mark { width:39px; height:39px; }
      .stats { gap:5px; }
      .stat { min-width:67px; padding:7px 6px; }
      .stat-label { font-size:8px; }
      .stat-value { font-size:17px; }
      canvas { height:58vh; min-height:330px; }
      .overlay { inset:7px; }
      footer { font-size:10px; }
      .touch { display:flex; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><div class="brand-mark" aria-hidden="true">✦</div><div><h1>Star Catcher</h1><p class="subtitle">A little cosmic arcade</p></div></div>
      <div class="stats" aria-live="polite">
        <div class="stat"><div class="stat-label">Caught</div><div class="stat-value"><span class="good" id="caught">0</span> / 10</div></div>
        <div class="stat"><div class="stat-label">Missed</div><div class="stat-value"><span class="bad" id="missed">0</span> / 3</div></div>
      </div>
    </header>
    <section class="frame" aria-label="Star Catcher game">
      <canvas id="game" aria-label="Move the basket left and right to catch falling stars"></canvas>
      <div class="overlay" id="overlay">
        <div class="dialog">
          <div class="eyebrow" id="eyebrow">Ready, stargazer?</div>
          <h2 id="headline">Catch the<br>falling stars</h2>
          <p class="message" id="message">Move your basket with the left and right arrow keys. Catch 10 stars to win, but miss 3 and the game is over.</p>
          <button id="start">Play</button>
        </div>
      </div>
    </section>
    <footer><span class="keys"><kbd>←</kbd><kbd>→</kbd><span>move your basket</span></span><span>Catch 10 stars · 3 misses and it’s over</span></footer>
    <div class="touch" aria-label="Touch controls"><button id="left" aria-label="Move basket left">←</button><button id="right" aria-label="Move basket right">→</button></div>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const caughtEl = document.getElementById('caught');
      const missedEl = document.getElementById('missed');
      const overlay = document.getElementById('overlay');
      const startButton = document.getElementById('start');
      const headline = document.getElementById('headline');
      const message = document.getElementById('message');
      const eyebrow = document.getElementById('eyebrow');
      const keys = new Set();
      const stars = [];
      let width = 0, height = 0, dpr = 1;
      let caught = 0, missed = 0, running = false, lastTime = 0, spawnTimer = 0;
      let basket = { x: 0, y: 0, width: 100, height: 25 };
      let pointerDirection = 0;
      let particles = [];

      function resize() {
        const rect = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width;
        height = rect.height;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        basket.width = Math.min(120, Math.max(82, width * 0.18));
        basket.y = height - 38;
        basket.x = Math.max(basket.width / 2, Math.min(width - basket.width / 2, basket.x || width / 2));
        draw();
      }

      function makeStar() {
        const radius = 13 + Math.random() * 8;
        stars.push({ x: radius + Math.random() * (width - radius * 2), y: -radius, radius, speed: 145 + Math.random() * 90, spin: Math.random() * Math.PI * 2, spinSpeed: (Math.random() - .5) * 2.5 });
      }

      function starShape(x, y, radius, rotation = 0) {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const angle = rotation - Math.PI / 2 + i * Math.PI / 5;
          const r = i % 2 ? radius * .43 : radius;
          const px = x + Math.cos(angle) * r;
          const py = y + Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
      }

      function burst(x, y) {
        for (let i = 0; i < 14; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 35 + Math.random() * 125;
          particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: .35 + Math.random() * .35, maxLife: .7, size: 2 + Math.random() * 3, hue: 35 + Math.random() * 60 });
        }
      }

      function draw() {
        if (!ctx || !width || !height) return;
        ctx.clearRect(0, 0, width, height);
        const bg = ctx.createLinearGradient(0, 0, width, height);
        bg.addColorStop(0, '#12172f'); bg.addColorStop(.55, '#11152a'); bg.addColorStop(1, '#211633');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, width, height);
        // Quiet distant stars give the playfield depth without distracting from falling stars.
        for (let i = 0; i < 42; i++) {
          const x = (i * 97.13) % width;
          const y = (i * 61.71) % height;
          ctx.globalAlpha = .2 + ((i * 13) % 7) / 14;
          ctx.fillStyle = i % 3 ? '#b7c9ff' : '#73f4e5';
          ctx.beginPath(); ctx.arc(x, y, i % 8 === 0 ? 1.5 : .8, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        for (const star of stars) {
          ctx.save(); ctx.shadowColor = '#ffe66b'; ctx.shadowBlur = 18;
          const gradient = ctx.createLinearGradient(star.x, star.y - star.radius, star.x, star.y + star.radius);
          gradient.addColorStop(0, '#fff9bd'); gradient.addColorStop(.55, '#ffe45f'); gradient.addColorStop(1, '#ff9d4c');
          ctx.fillStyle = gradient; starShape(star.x, star.y, star.radius, star.spin); ctx.fill(); ctx.restore();
        }
        for (const p of particles) {
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife); ctx.fillStyle = `hsl(${p.hue} 100% 70%)`;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        // Draw a glowing woven basket.
        ctx.save(); ctx.translate(basket.x, basket.y);
        ctx.shadowColor = '#ff82d1'; ctx.shadowBlur = 20;
        ctx.strokeStyle = '#ffd0f0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(0, 3, basket.width * .36, Math.PI, Math.PI * 2); ctx.stroke();
        const bowl = ctx.createLinearGradient(0, 0, 0, basket.height + 6);
        bowl.addColorStop(0, '#ff9ed4'); bowl.addColorStop(1, '#9272ff'); ctx.fillStyle = bowl;
        ctx.beginPath(); ctx.moveTo(-basket.width / 2, 0); ctx.quadraticCurveTo(-basket.width * .43, basket.height, 0, basket.height); ctx.quadraticCurveTo(basket.width * .43, basket.height, basket.width / 2, 0); ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0; ctx.strokeStyle = '#ffe0f2'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-basket.width / 2, 0); ctx.quadraticCurveTo(0, 9, basket.width / 2, 0); ctx.stroke();
        ctx.strokeStyle = '#ffffff66'; ctx.lineWidth = 1.3;
        for (let x = -basket.width * .34; x < basket.width * .4; x += 12) { ctx.beginPath(); ctx.moveTo(x, 5); ctx.lineTo(x + 5, basket.height - 1); ctx.stroke(); }
        ctx.restore();
      }

      function finish(won) {
        running = false;
        eyebrow.textContent = won ? 'Wish granted!' : 'Game over';
        headline.innerHTML = won ? 'Stellar<br>catching!' : 'The stars<br>got away';
        message.textContent = won
          ? 'You caught 10 stars! The night sky is shining a little brighter.'
          : `You caught ${caught} ${caught === 1 ? 'star' : 'stars'} before 3 slipped by. Give it another try!`;
        startButton.textContent = 'Play again';
        overlay.classList.remove('hidden');
      }

      function start() {
        caught = 0; missed = 0; spawnTimer = 0; lastTime = performance.now();
        stars.length = 0; particles.length = 0; keys.clear();
        caughtEl.textContent = '0'; missedEl.textContent = '0';
        basket.x = width / 2;
        running = true; overlay.classList.add('hidden');
        requestAnimationFrame(frame);
      }

      function update(dt) {
        const direction = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0) || pointerDirection;
        basket.x += direction * Math.min(520, width * .8) * dt;
        basket.x = Math.max(basket.width / 2, Math.min(width - basket.width / 2, basket.x));
        spawnTimer += dt;
        if (spawnTimer >= .72) { spawnTimer = 0; makeStar(); }

        for (let i = stars.length - 1; i >= 0; i--) {
          const star = stars[i]; star.y += star.speed * dt; star.spin += star.spinSpeed * dt;
          const overlapsBasket = Math.abs(star.x - basket.x) < basket.width * .46 + star.radius * .45 && star.y + star.radius >= basket.y - 7 && star.y - star.radius <= basket.y + basket.height;
          if (overlapsBasket) {
            stars.splice(i, 1); caught++; caughtEl.textContent = String(caught); burst(star.x, star.y);
            if (caught >= 10) { finish(true); return; }
          } else if (star.y - star.radius > height) {
            stars.splice(i, 1); missed++; missedEl.textContent = String(missed);
            if (missed >= 3) { finish(false); return; }
          }
        }
        particles = particles.filter(p => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; return p.life > 0; });
        draw();
      }

      function frame(time) {
        if (!running) return;
        const dt = Math.min((time - lastTime) / 1000, .035); lastTime = time;
        update(dt);
        if (running) requestAnimationFrame(frame);
      }

      startButton.addEventListener('click', start);
      window.addEventListener('resize', resize);
      window.addEventListener('keydown', event => {
        if (['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
        if (!running && (event.key === 'Enter' || event.key === ' ')) { start(); return; }
        keys.add(event.code);
      });
      window.addEventListener('keyup', event => keys.delete(event.code));
      window.addEventListener('blur', () => { keys.clear(); pointerDirection = 0; });

      function bindDirection(id, direction) {
        const button = document.getElementById(id);
        button.addEventListener('pointerdown', event => { event.preventDefault(); pointerDirection = direction; button.setPointerCapture(event.pointerId); });
        for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) button.addEventListener(name, () => { pointerDirection = 0; });
      }
      bindDirection('left', -1); bindDirection('right', 1);
      canvas.addEventListener('pointerdown', event => {
        if (!running) return;
        const rect = canvas.getBoundingClientRect();
        basket.x = Math.max(basket.width / 2, Math.min(width - basket.width / 2, event.clientX - rect.left));
      });
      resize();
    })();
  </script>
</body>
</html>
