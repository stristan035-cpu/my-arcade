<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1c">
  <title>Star Catcher — My Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #f7fbff;
      background: #080d1c;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, #35427c 0%, #192341 42%, #080d1c 100%);
    }

    main {
      width: min(100%, 720px);
      padding: clamp(32px, 8vw, 76px) 24px;
      text-align: center;
    }

    .mark {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 26px;
      border: 2px solid #ffffff66;
      border-radius: 23px;
      background: linear-gradient(145deg, #43f5de, #7864ff 54%, #ff4fc8);
      box-shadow: 0 0 38px #5de8f877;
      font-size: 40px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #70edee;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 11vw, 88px);
      line-height: .98;
      letter-spacing: -.065em;
      text-shadow: 0 0 28px #a16cff99;
    }

    .description {
      max-width: 440px;
      margin: 22px auto 34px;
      color: #c0cce4;
      font-size: clamp(16px, 3vw, 19px);
      line-height: 1.6;
    }

    .play {
      min-width: 210px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 17px 30px;
      border: 1px solid #ffffffaa;
      border-radius: 14px;
      color: #111936;
      background: linear-gradient(110deg, #57f5dc, #78c8ff 48%, #d889ff);
      box-shadow: 0 0 30px #48e8df77, 0 6px 0 #5242a5;
      font-size: 20px;
      font-weight: 950;
      text-decoration: none;
      transition: transform .15s, filter .15s, box-shadow .15s;
    }

    .play:hover { transform: translateY(-3px); filter: brightness(1.1); }
    .play:active { transform: translateY(3px); box-shadow: 0 0 16px #48e8df66; }
    .play:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    .play span { font-size: 17px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <p class="eyebrow">Welcome to my arcade</p>
    <h1>Star Catcher</h1>
    <p class="description">Slide your basket beneath the falling stars and catch 10 to make a wish come true.</p>
    <a class="play" href="game.html"><span aria-hidden="true">▶</span> Play</a>
  </main>
</body>
</html>
