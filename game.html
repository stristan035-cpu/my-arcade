<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d1c">
  <title>Neon Pong — My Arcade</title>
  <style>
    :root{color-scheme:dark;--ink:#f7fbff;--muted:#a7b8d4;--aqua:#60f1df;--pink:#ff62c8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
    body{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#303d74 0%,#17223f 42%,#080d1c 100%)}
    main{width:min(100%,900px)}
    .menu-link{display:inline-block;margin:0 0 14px 4px;color:#a9bbda;font-size:13px;font-weight:800;text-decoration:none;transition:color .15s,transform .15s}.menu-link:hover{color:#70edee;transform:translateX(-2px)}.menu-link:focus-visible{outline:2px solid #70edee;outline-offset:4px;border-radius:3px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 4px 16px}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#43f5de,#7864ff 54%,#ff4fc8);box-shadow:0 0 24px #5de8f877;font-size:26px}
    h1{margin:0;font-size:clamp(24px,5vw,34px);line-height:1;letter-spacing:-.05em;text-shadow:0 0 18px #a16cff}.tag{margin-top:6px;color:#70edee;font-size:10px;font-weight:850;letter-spacing:.17em;text-transform:uppercase}
    .badge{border:1px solid #67f3e577;border-radius:10px;padding:9px 13px;color:#8fffee;background:#42eadf12;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
    .badge b{margin-left:5px;color:#fff;font-size:15px}
    .badge small{display:block;margin-top:4px;color:#86b6c3;font-size:9px;letter-spacing:.06em;text-transform:none}
    .frame{position:relative;padding:12px;border:2px solid #58e8eb;border-radius:20px;background:linear-gradient(145deg,#182547,#11172e 60%,#201534);box-shadow:0 0 0 5px #12182b,0 0 0 7px #f04fc855,0 24px 70px #02040bbd,0 0 35px #2ff7ef22;overflow:hidden}
    .frame:before{position:absolute;z-index:1;inset:0 0 auto;height:4px;background:linear-gradient(90deg,#ff4fc8,#ffc53d,#5df3d5,#7380ff,#ff4fc8);content:""}
    .scoreboard{position:absolute;z-index:1;top:24px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:clamp(28px,10vw,100px);pointer-events:none}
    .score{text-align:center;min-width:65px}.score-label{font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#aabbd8}.score-num{font-size:clamp(28px,6vw,42px);font-weight:950;line-height:1.1;text-shadow:0 0 18px currentColor}.you .score-num{color:#65f7e5}.bot .score-num{color:#ff70cd}.versus{color:#7285a8;font-size:12px;font-weight:950;letter-spacing:.15em}
    canvas{display:block;width:100%;height:min(66vh,570px);min-height:350px;border:1px solid #65dae866;border-radius:12px;background:#0b1024;touch-action:none;cursor:ns-resize}
    .overlay{position:absolute;z-index:2;inset:12px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#10152de8,#1a1031df);backdrop-filter:blur(7px);transition:opacity .2s}.overlay.hidden{opacity:0;pointer-events:none}
    .dialog{max-width:420px;padding:24px;text-align:center}.eyebrow{color:var(--aqua);font-size:11px;font-weight:950;letter-spacing:.22em;text-transform:uppercase;text-shadow:0 0 12px #29dddb}h2{margin:10px 0;font-size:clamp(34px,7vw,52px);line-height:1;letter-spacing:-.06em;text-shadow:0 0 22px #ac4dff}.message{max-width:330px;margin:12px auto 22px;color:#c0cce4;line-height:1.55}
    button{border:1px solid #fff9;border-radius:11px;padding:14px 28px;color:#111936;background:linear-gradient(110deg,#57f5dc,#78c8ff 48%,#d889ff);font:inherit;font-size:16px;font-weight:950;cursor:pointer;box-shadow:0 0 22px #48e8df66,0 5px 0 #5242a5;transition:transform .15s,filter .15s}button:hover{transform:translateY(-2px);filter:brightness(1.12)}button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid white;outline-offset:4px}
    footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 8px 0;color:#a0b0cd;font-size:12px}.keys{display:flex;align-items:center;gap:6px}kbd{padding:3px 7px;border:1px solid #6e8baa;border-bottom:3px solid #455879;border-radius:6px;color:#dbfaff;background:#1c2945;font:inherit;font-size:11px;font-weight:900}.hint{color:#91a5c8;text-align:right}
    .touch{display:none;justify-content:center;gap:14px;margin-top:12px}.touch button{width:82px;padding:12px;border-color:#57eee477;color:#70f7e5;background:linear-gradient(145deg,#293b64,#181f3b);box-shadow:0 4px 0 #10152a;font-size:21px;touch-action:none;user-select:none;-webkit-user-select:none}
    @media(max-width:560px){body{padding:16px 13px}.frame{padding:8px;border-radius:16px}header{margin-bottom:12px}.mark{width:41px;height:41px}.badge{padding:7px;font-size:8px;letter-spacing:.04em}.badge b{font-size:12px}.scoreboard{top:15px}canvas{height:58vh;min-height:330px}.overlay{inset:8px}footer{font-size:10px}.touch{display:flex}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <a class="menu-link" href="index.html">← Menu</a>
    <header><div class="brand"><div class="mark" aria-hidden="true">↔</div><div><h1>Neon Pong</h1><div class="tag">Player vs. bot</div></div></div><div class="badge">Best: <b id="bestScore">0</b><small>Arcade Points: <span id="arcadePoints">0</span></small><small id="powerupStatus" hidden></small></div></header>
    <section class="frame" aria-label="Neon Pong game">
      <div class="scoreboard" aria-live="polite"><div class="score you"><div class="score-label">You</div><div class="score-num" id="playerScore">0</div></div><div class="versus">VS</div><div class="score bot"><div class="score-label">Bot</div><div class="score-num" id="botScore">0</div></div></div>
      <canvas id="court" aria-label="Pong court. Move your paddle with W and S, the up and down arrows, or touch controls."></canvas>
      <div class="overlay" id="overlay"><div class="dialog"><div class="eyebrow" id="eyebrow">Ready to rally?</div><h2 id="headline">Neon<br>Pong</h2><p class="message" id="message">Move your paddle with W/S or ↑/↓. Return the ball and score 7 points before the bot does.</p><button id="start">Start match</button></div></div>
    </section>
    <footer><div class="keys"><kbd>W</kbd><kbd>S</kbd><span>or</span><kbd>↑</kbd><kbd>↓</kbd><span>move paddle</span></div><div class="hint">First to 7 points · Tap the court to move</div></footer>
    <div class="touch"><button id="up" aria-label="Move paddle up">↑</button><button id="down" aria-label="Move paddle down">↓</button></div>
    <a class="menu-link" href="index.html">← Back to menu</a>
  </main>
  <script>
  (()=>{
    const canvas=document.getElementById('court'),ctx=canvas.getContext('2d');
    const overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');
    const playerScoreEl=document.getElementById('playerScore'),botScoreEl=document.getElementById('botScore');
    const bestScoreEl=document.getElementById('bestScore');
    const pointsEl=document.getElementById('arcadePoints');
    const W0=900,H0=540,goal=7,keys=new Set();
    let dpr=1,w=W0,h=H0,running=false,last=0,serveTimer=0,playerScore=0,botScore=0,upHeld=false,downHeld=false;
    const bestKey='neonPongBestScore';
    function readBest(){try{const value=Number(localStorage.getItem(bestKey));return Number.isFinite(value)&&value>0?value:0}catch{return 0}}
    let bestScore=readBest();bestScoreEl.textContent=bestScore;
    function saveBest(){if(playerScore<=bestScore)return;bestScore=playerScore;bestScoreEl.textContent=bestScore;try{localStorage.setItem(bestKey,String(bestScore))}catch{}}
    const pointsKey='arcadePoints';let arcadePoints=0;try{arcadePoints=Math.max(0,Number(localStorage.getItem(pointsKey))||0)}catch{}pointsEl.textContent=arcadePoints;
    function awardPoints(){arcadePoints+=10;pointsEl.textContent=arcadePoints;try{localStorage.setItem(pointsKey,String(arcadePoints))}catch{}}
    function takePowerups(key){try{const bag=JSON.parse(localStorage.getItem('arcadeInventory')||'{}'),count=Math.max(0,Math.floor(Number(bag[key])||0));if(!count)return 0;bag[key]=0;localStorage.setItem('arcadeInventory',JSON.stringify(bag));return count}catch{return 0}}
    const paddle={w:13,h:94,speed:440},player={x:30,y:H0/2-47},bot={x:W0-43,y:H0/2-47},ball={x:W0/2,y:H0/2,r:9,vx:0,vy:0,speed:410};let playerH=paddle.h;
    function resize(){const rect=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);w=W0;h=H0;ctx.setTransform(canvas.width/W0,0,0,canvas.height/H0,0,0);draw()}
    function serve(direction){ball.x=w/2;ball.y=h/2;ball.speed=410+Math.min((playerScore+botScore)*9,100);const angle=(Math.random()*.7-.35);ball.vx=Math.cos(angle)*ball.speed*direction;ball.vy=Math.sin(angle)*ball.speed;serveTimer=.65}
    function start(){playerScore=0;botScore=0;playerScoreEl.textContent='0';botScoreEl.textContent='0';const paddleCharges=takePowerups('powerPaddle');playerH=Math.min(400,94+paddleCharges*20);const powerupStatus=document.getElementById('powerupStatus');powerupStatus.hidden=paddleCharges===0;if(!powerupStatus.hidden)powerupStatus.textContent=`POWER PADDLE ×${paddleCharges} ACTIVE`;player.y=h/2-playerH/2;bot.y=h/2-paddle.h/2;running=true;serve( Math.random()<.5?-1:1);overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
    function finish(won){running=false;document.getElementById('eyebrow').textContent=won?'Match won!':'Match over';document.getElementById('headline').innerHTML=won?'You<br>win!':'Bot<br>wins!';document.getElementById('message').textContent=won?'Great rally. Want to play again?':'The bot got to 7 first. Give it another go?';startBtn.textContent='Play again';overlay.classList.remove('hidden');draw()}
    function roundRect(x,y,rw,rh,rad){ctx.beginPath();ctx.roundRect(x,y,rw,rh,rad);ctx.fill()}
    function draw(){ctx.clearRect(0,0,W0,H0);const grad=ctx.createLinearGradient(0,0,W0,H0);grad.addColorStop(0,'#0c1730');grad.addColorStop(.5,'#11142c');grad.addColorStop(1,'#211333');ctx.fillStyle=grad;ctx.fillRect(0,0,W0,H0);
      ctx.save();ctx.setLineDash([11,15]);ctx.lineWidth=3;ctx.strokeStyle='#7286af38';ctx.beginPath();ctx.moveTo(W0/2,24);ctx.lineTo(W0/2,H0-24);ctx.stroke();ctx.restore();
      ctx.save();ctx.strokeStyle='#7184aa26';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W0/2,H0/2,55,0,Math.PI*2);ctx.stroke();ctx.restore();
      const drawPaddle=(p,top,bottom,height=paddle.h)=>{ctx.save();ctx.shadowColor=top;ctx.shadowBlur=25;const g=ctx.createLinearGradient(p.x,p.y,p.x+paddle.w,p.y+height);g.addColorStop(0,top);g.addColorStop(.48,bottom);g.addColorStop(1,top);ctx.fillStyle=g;roundRect(p.x,p.y,paddle.w,height,7);ctx.shadowBlur=0;ctx.strokeStyle='#ffffff99';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(p.x+2,p.y+3,paddle.w-4,height-6,5);ctx.stroke();ctx.fillStyle='#ffffff66';for(let y=p.y+12;y<p.y+height-8;y+=16)roundRect(p.x+4,y,paddle.w-8,3,2);ctx.restore()};drawPaddle(player,'#a8fff4','#27cdbd',playerH);drawPaddle(bot,'#ffc0e9','#d83fa9');
      ctx.save();const trailAngle=Math.atan2(ball.vy,ball.vx);for(let i=3;i>=1;i--){ctx.globalAlpha=.045*i;ctx.fillStyle='#74f8ff';ctx.beginPath();ctx.arc(ball.x-Math.cos(trailAngle)*i*9,ball.y-Math.sin(trailAngle)*i*9,ball.r*(.55+i*.1),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowColor='#7cfbff';ctx.shadowBlur=25;const ballGrad=ctx.createRadialGradient(ball.x-ball.r*.35,ball.y-ball.r*.4,1,ball.x,ball.y,ball.r*1.35);ballGrad.addColorStop(0,'#ffffff');ballGrad.addColorStop(.42,'#eaffff');ballGrad.addColorStop(1,'#6af5ff');ctx.fillStyle=ballGrad;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.arc(ball.x-ball.r*.3,ball.y-ball.r*.35,ball.r*.22,0,Math.PI*2);ctx.fill();ctx.restore();
      if(serveTimer>0&&running){ctx.fillStyle='#aabbd877';ctx.font='700 13px system-ui';ctx.textAlign='center';ctx.fillText('GET READY',W0/2,H0/2+46)}
    }
    function hit(p,isPlayer){if(ball.vx*(isPlayer?1:-1)>=0)return;const height=isPlayer?playerH:paddle.h,rel=(ball.y-(p.y+height/2))/(height/2);const angle=Math.max(-1,Math.min(1,rel))*.98;const speed=Math.min(Math.hypot(ball.vx,ball.vy)*1.045,780);ball.vx=Math.cos(angle)*speed*(isPlayer?1:-1);ball.vy=Math.sin(angle)*speed;ball.x=isPlayer?p.x+paddle.w+ball.r:p.x-ball.r}
    function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.03);last=now;const move=(keys.has('ArrowUp')||keys.has('w')||keys.has('W')||upHeld?-1:0)+(keys.has('ArrowDown')||keys.has('s')||keys.has('S')||downHeld?1:0);player.y=Math.max(12,Math.min(H0-playerH-12,player.y+move*paddle.speed*dt));
      if(serveTimer>0)serveTimer-=dt;else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y-ball.r<8){ball.y=8+ball.r;ball.vy=Math.abs(ball.vy)}if(ball.y+ball.r>H0-8){ball.y=H0-8-ball.r;ball.vy=-Math.abs(ball.vy)}
        const target=ball.vx>0?ball.y-paddle.h/2: H0/2-paddle.h/2;const botSpeed=ball.vx>0?285:190;bot.y+=Math.max(-botSpeed*dt,Math.min(botSpeed*dt,target-bot.y));bot.y=Math.max(12,Math.min(H0-paddle.h-12,bot.y));
        if(ball.x-ball.r<player.x+paddle.w&&ball.x+ball.r>player.x&&ball.y+ball.r>player.y&&ball.y-ball.r<player.y+playerH)hit(player,true);
        if(ball.x+ball.r>bot.x&&ball.x-ball.r<bot.x+paddle.w&&ball.y+ball.r>bot.y&&ball.y-ball.r<bot.y+paddle.h)hit(bot,false);
        if(ball.x<-ball.r){botScore++;botScoreEl.textContent=botScore;if(botScore>=goal){finish(false);return}serve(-1)}else if(ball.x>W0+ball.r){playerScore++;playerScoreEl.textContent=playerScore;awardPoints();saveBest();if(playerScore>=goal){finish(true);return}serve(1)}
      }draw();requestAnimationFrame(loop)}
    function pointerMove(e){const rect=canvas.getBoundingClientRect();player.y=Math.max(12,Math.min(H0-playerH-12,(e.clientY-rect.top)/rect.height*H0-playerH/2));draw()}
    canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointerMove(e)});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointerMove(e)});
    window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key===' '&&!running)start()});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>{keys.clear();upHeld=false;downHeld=false});
    function hold(id,set){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();set(true);el.setPointerCapture(e.pointerId)});for(const type of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(type,()=>set(false))}hold('up',v=>upHeld=v);hold('down',v=>downHeld=v);
    startBtn.addEventListener('click',start);window.addEventListener('resize',resize);resize();serve(1);draw();
  })();
  </script>
</body>
</html>
